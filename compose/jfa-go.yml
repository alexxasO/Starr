services:
  jfa-go:
    container_name: jfa-go
    image: hrfee/jfa-go
    ports:
    - 8056:8056
    volumes:
    - ${APPDATA_PATH}/jfa-go:/data
    - ${APPDATA_PATH}/jellyfin:/jf
    - /etc/localtime:/etc/localtime:ro
    networks:
    - traefik-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8056"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      jellyfin:
        condition: service_healthy
        restart: true
    command: ["/opt/jfa-go/jfa-go", "-data", "/data", "-swagger"]
    restart: unless-stopped
