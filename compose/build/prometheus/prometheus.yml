global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'antxis'

rule_files:
- 'alert.rules'

scrape_configs:
- job_name: 'prometheus'
  static_configs:
  - targets: [ 'localhost:9090' ]

- job_name: 'node'
  static_configs:
  # node-exporter runs in the host network namespace
  - targets: [ 'host.docker.internal:9100' ]
    labels:
      instance: 'mediaserver'

- job_name: 'cadvisor'
  static_configs:
  - targets: [ 'cadvisor:8080' ]
    labels:
      instance: 'mediaserver'

- job_name: 'jellyfin-exporter'
  # Each scrape hits the Jellyfin API, no need to do it more often
  scrape_interval: 30s
  static_configs:
  - targets: [ 'jellyfin-exporter:9594' ]
    labels:
      instance: 'mediaserver'

# Jellyfin built-in metrics (.NET runtime, HTTP requests).
# Requires <EnableMetrics>true</EnableMetrics> in ${APPDATA_PATH}/jellyfin/system.xml + a Jellyfin restart.
# - job_name: 'jellyfin'
#   static_configs:
#   - targets: [ 'jellyfin:8096' ]
