services:
  readarr:
    container_name: readarr
    restart: unless-stopped
    image: ghcr.io/hotio/readarr
    ports:
    - "8787:8787"
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - UMASK=${UMASK}
    - TZ=${TZ}
    volumes:
    - ${APPDATA_PATH}/readarr:/config
    - ${DATA_PATH}:/data
    - /mnt:/mnt:rshared
    - /mounts:/mounts:rshared
    depends_on:
      rclone:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989"]
      interval: 1m30s
      timeout: 10s
      retries: 3
    networks:
    - traefik-net
    # - blackhole-net
    labels:
    - "org.hotio.pullio.notify=true"
    - "org.hotio.pullio.update=true"
    - "org.hotio.pullio.discord.webhook=${DISCORD_WEBHOOK}"
    - "traefik.enable=true"
    - "traefik.http.routers.readarr.rule=Host(`readarr.${DOMAIN}`)"
    - "traefik.http.services.readarr.loadbalancer.server.port=8989" # Default Sonarr port
