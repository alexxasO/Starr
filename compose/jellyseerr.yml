services:
  jellyseerr:
    container_name: jellyseerr
    restart: unless-stopped
    image: ghcr.io/hotio/seerr:latest
    ports:
    - "5055:5055"
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - UMASK=${UMASK}
    - TZ=${TZ}
    volumes:
    - ${APPDATA_PATH}/jellyseerr:/config
    depends_on:
      sonarr:
        condition: service_healthy
        restart: true
      radarr:
        condition: service_healthy
        restart: true
      jellyfin:
        condition: service_healthy
        restart: true
    networks:
    - traefik-net
    labels:
    - "org.hotio.pullio.notify=true"
    - "org.hotio.pullio.update=true"
    - "org.hotio.pullio.discord.webhook=${DISCORD_WEBHOOK}"
