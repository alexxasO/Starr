services:
  calibre:
    image: lscr.io/linuxserver/calibre:latest
    container_name: calibre
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ${APPDATA_PATH}/calibre:/config
      - ${DATA_PATH}/media/books:/books
    ports:
      - 8083:8080
      - 8181:8181
      - 8081:8081
    shm_size: "1gb"
    restart: unless-stopped