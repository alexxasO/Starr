services:
  jellyfin:
    container_name: jellyfin
    restart: unless-stopped
    build:
      context: ./build/jellyfin
      dockerfile: Dockerfile.jellyfin
    # image: ghcr.io/hotio/jellyfin:release-10.10.7
    image: ghcr.io/hotio/jellyfin:latest
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - UMASK=${UMASK}
    - TZ=${TZ}
    volumes:
    - ${APPDATA_PATH}/jellyfin:/config
    - ${DATA_PATH}:/data
    # - ${APPDATA_PATH}/jellyfin/featured-content/List.txt:/usr/share/jellyfin/web/ui/List.txt
    # - ${APPDATA_PATH}/jellyfin/featured-content/message.txt:/usr/share/jellyfin/web/ui/message.txt
    - /mnt:/mnt:rshared
    - /mounts:/mounts:rshared
    ports:
    - 8096:8096
    healthcheck:
      test: curl -f localhost:8096/web/index.html || exit 1
      interval: 1m
      timeout: 10s
      retries: 5
#    depends_on:
#      rclone:
#        condition: service_healthy
#        restart: true
    networks:
    - traefik-net
    labels:
    - "org.hotio.pullio.notify=true"
    - "org.hotio.pullio.update=true"
    - "org.hotio.pullio.discord.webhook=${DISCORD_WEBHOOK}"

