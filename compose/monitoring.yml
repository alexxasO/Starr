networks:
  monitoring-net:

services:
  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    ports:
    # 3000 is already taken by tracearr
    - ${GRAFANA_PORT:-3030}:3000
    environment:
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    - GF_USERS_ALLOW_SIGN_UP=false
    - GF_ANALYTICS_REPORTING_ENABLED=false
    - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/performance.json
    - TZ=${TZ}
    networks:
    - traefik-net
    - monitoring-net
    volumes:
    - ${APPDATA_PATH}/grafana:/var/lib/grafana
    - ./grafana/provisioning:/etc/grafana/provisioning:ro
    - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
    - prometheus
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
    - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    command:
    - '--config.file=/etc/prometheus/prometheus.yml'
    - '--storage.tsdb.path=/prometheus'
    # Whichever limit is hit first wins: keep the TSDB small, the root disk is nearly full
    - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}'
    - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-4GB}'
    ports:
    # Local only: reach it through an SSH tunnel (ssh -L 9090:localhost:9090 ...)
    - 127.0.0.1:9090:9090
    networks:
    - monitoring-net
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - ${APPDATA_PATH}/prometheus/data:/prometheus
    - ./build/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./build/prometheus/alert.rules:/etc/prometheus/alert.rules:ro
    environment:
    - TZ=${TZ}

  # Exporters

  # Host metrics: CPU, RAM, disks, network.
  # Runs in the host network namespace so network counters are the host's (ens18), not a container's.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
    - '--path.rootfs=/host'
    - '--web.listen-address=:9100'
    - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|erofs|sysfs|tracefs|tmpfs)$$'
    volumes:
    - /:/host:ro,rslave

  # Per-container metrics: CPU, RAM, network, disk IO
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    devices:
    - /dev/kmsg
    command:
    - '--docker_only=true'
    - '--housekeeping_interval=15s'
    - '--store_container_labels=false'
    - '--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service'
    # Only what the dashboards use: cAdvisor is CPU hungry on a 3 vCPU host
    - '--enable_metrics=cpu,memory,network,diskIO,oom_event'
    networks:
    - monitoring-net
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    - /dev/disk/:/dev/disk:ro

  # Jellyfin sessions: active streams, transcodes, play method
  jellyfin-exporter:
    image: rebelcore/jellyfin-exporter:v1.5.3
    container_name: jellyfin-exporter
    restart: unless-stopped
    command:
    - '--jellyfin.address=http://jellyfin:8096'
    - '--collector.transcoding'
    environment:
    - JELLYFIN_TOKEN=${JELLYFIN_TOKEN}
    networks:
    - traefik-net
    - monitoring-net
