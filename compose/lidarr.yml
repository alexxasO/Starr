services:
  lidarr:
    container_name: lidarr
    image: ghcr.io/hotio/lidarr
    ports:
      - "8686:8686"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=Etc/UTC
    volumes:
      - ${APPDATA_PATH}/lidarr:/config
      - ${DATA_PATH}:/data
      - /mnt:/mnt:rshared
    restart: unless-stopped
    networks:
      - traefik-net
