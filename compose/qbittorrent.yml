services:
  qbittorrent:
    container_name: qbittorrent
    restart: unless-stopped
    image: hotio/qbittorrent:release-4.5.5
    ports:
    - "8080:8080"
    environment:
    - PUID=${PUID}
    - PGID=${PGID}
    - UMASK=${UMASK}
    - TZ=${TZ}
    - WEBUI_PORTS=8080/tcp,8080/udp
    volumes:
    - ${APPDATA_PATH}/qbittorrent:/config
    - ${APPDATA_PATH}/qbittorrent-games:/games
    - ${DATA_PATH}:/data
    labels:
    - "org.hotio.pullio.notify=true"
    - "org.hotio.pullio.update=false"
    - "org.hotio.pullio.discord.webhook=${DISCORD_WEBHOOK}"
    - "traefik.enable=true"
    - "traefik.http.routers.qbittorrent.rule=Host(`qbit.${DOMAIN}`)"
    - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"
    networks:
    - traefik-net
    - qbit-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m
